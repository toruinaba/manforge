[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "returnmap"
version = "0.4.1"
description = "Framework for validating Fortran UMAT constitutive models with autodiff"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Toru Inaba"},
]
requires-python = ">=3.10"
keywords = [
    "plasticity", "constitutive model", "return mapping", "consistent tangent",
    "UMAT", "Abaqus", "automatic differentiation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Fortran",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
dependencies = [
    "autograd>=1.8.0",
    "numpy",
    "scipy",
    "typing-extensions>=4.0",
]

[project.optional-dependencies]
dev = ["pytest", "pyright>=1.1.380"]
examples = ["matplotlib"]
notebook = ["marimo>=0.20", "matplotlib"]
docs = ["sphinx>=7.3", "myst-parser>=3.0", "furo>=2024.5"]
fortran = ["meson>=1.10.2", "ninja>=1.13.0"]

[project.urls]
Homepage = "https://github.com/toruinaba/returnmap"
Repository = "https://github.com/toruinaba/returnmap"
Documentation = "https://toruinaba.github.io/returnmap/"
Changelog = "https://toruinaba.github.io/returnmap/changelog.html"
Issues = "https://github.com/toruinaba/returnmap/issues"

[project.scripts]
returnmap = "returnmap.cli:main"

# Named after the module so that loading it again by that name (-p, or
# pytest_plugins in a conftest) is recognised as the same plugin.
[project.entry-points.pytest11]
"returnmap.pytest_plugin" = "returnmap.pytest_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/returnmap"]

# The source distribution holds what the wheel is built from, and nothing else
# of the repository.  The framework tests (tests/) are left out with the rest:
# they read docs/ and examples/, so they run from a checkout.  The model tests
# are inside the package and travel with it.
[tool.hatch.build.targets.sdist]
include = ["/src", "/README.md", "/CHANGELOG.md", "/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests", "src/returnmap/models"]
addopts = "--strict-markers --import-mode=importlib"
pythonpath = ["."]
# The slow / fortran markers are registered by returnmap.pytest_plugin.

[tool.pyright]
include = ["src/returnmap"]
exclude = ["**/tests"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportGeneralTypeIssues = "warning"
reportAttributeAccessIssue = "none"
