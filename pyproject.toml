[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "returnmap"
version = "0.2.1"
description = "Framework for validating Fortran UMAT constitutive models with autodiff"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Toru Inaba"},
]
requires-python = ">=3.10"
dependencies = [
    "autograd>=1.8.0",
    "numpy",
    "scipy",
    "typing-extensions>=4.0",
]

[project.optional-dependencies]
dev = ["pytest", "pyright>=1.1.380"]
examples = ["matplotlib"]
notebook = ["marimo>=0.20", "matplotlib"]
docs = ["sphinx>=7.3", "myst-parser>=3.0", "furo>=2024.5"]
fortran = ["meson>=1.10.2", "ninja>=1.13.0"]

[project.urls]
Homepage = "https://github.com/toruinaba/returnmap"
Repository = "https://github.com/toruinaba/returnmap"

[project.scripts]
returnmap = "returnmap.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/returnmap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --import-mode=importlib"
pythonpath = ["."]
markers = [
    "slow: measured >1s (fitting, long cyclic loops) -- deselect with -m 'not slow'",
    "fortran: requires compiled Fortran modules (f2py). Auto-skipped if module missing -- deselect with -m 'not fortran'",
]

[tool.pyright]
include = ["src/returnmap"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportGeneralTypeIssues = "warning"
reportAttributeAccessIssue = "none"
